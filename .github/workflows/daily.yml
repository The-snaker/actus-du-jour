name: Mise à jour quotidienne
on:
  push:
    paths:
      - sources.json
      - collect.py
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
      - name: Enregistrer les résultats
        run: |
          git config user.name "actus-bot"
          git config user.email "actus-bot@users.noreply.github.com"
          git add news.json rapport.txt
          git diff --cached --quiet || git commit -m "Mise à jour $(date -u +%F)"
          git push
