name: Mise à jour des actualités
on:
  push:
    paths:
      - sources.json
      - collect.py
  schedule:
    # 5 collectes par jour, toutes les 5 h (heures UTC : 00h07, 05h07, 10h07, 15h07, 20h07)
    - cron: "7 */5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collecte
  cancel-in-progress: false
jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collect.py
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
      - name: Enregistrer les résultats
        run: |
          git config user.name "actus-bot"
          git config user.email "actus-bot@users.noreply.github.com"
          git add news.json rapport.txt
          git diff --cached --quiet || git commit -m "Mise à jour $(date -u +%F' '%H:%M) UTC"
          git pull --rebase origin main
          git push
